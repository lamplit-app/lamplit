appId: com.lamplit.app
productName: Lamplit
copyright: MIT — https://github.com/lamplit-app/lamplit

directories:
  output: ../build/desktop
  buildResources: icons

# The shell only. It is a few kilobytes, so it goes in the asar; everything
# that has to be read by Node at runtime stays outside one, below.
files:
  # Every module the shell is made of, as a glob rather than a list of names.
  # It was a list, and the list did not follow the code: `main.mjs` was one
  # file when it was written and is eight now, so 0.2.0's installers shipped
  # without seven of them and died on the first import of the run. A glob
  # cannot fall behind a split that has not happened yet. Nothing else at the
  # top of `electron/` is a module, and `icons/` is build resources.
  - '*.mjs'
  - preload.cjs
  # What the window shows while the server behind it is still starting.
  - splash.html
  - package.json

# The staged folder from tools/package.mjs, copied in whole: the same server,
# the same built app and the same dependencies the zip ships. Unpacked rather
# than inside the asar, because the server is ES modules importing CommonJS and
# an archive is one more thing that could be the reason it did not.
extraResources:
  - from: ../build/desktop-stage/server
    to: app/server
  # Beside the server, because the server imports it as `../../wire/…`. Two
  # files' worth, and without it nothing starts.
  - from: ../build/desktop-stage/wire
    to: app/wire
  - from: ../build/desktop-stage/public
    to: app/public
  - from: ../build/desktop-stage/node_modules
    to: app/node_modules
  # Nothing above it declares `type: module`, so without this the server's
  # own ES modules are read as CommonJS and none of them parse.
  - from: ../build/desktop-stage/package.json
    to: app/package.json

# Electron will load an app folder sitting beside app.asar in preference to the
# asar itself, which is a way in for anything that can write next to the
# binary. This build has both — the shell in the asar, the server unpacked in
# `resources/app` — and loads the shell from the asar, so saying "only ever the
# asar" removes an ambiguity rather than changing what runs. The server is
# imported by that shell at runtime and is not what this fuse governs.
electronFuses:
  onlyLoadAppFromAsar: true

# Where the installers look for a new version. Nothing else is configured for
# it: the release workflow uploads to this same repository's releases.
publish:
  provider: github
  owner: lamplit-app
  repo: lamplit
  # A draft, always: nothing here is signed, so a person looks at what arrived
  # before anyone can download it.
  releaseType: draft

# The download page's buttons point at
# .../releases/latest/download/<name>, which only stays a link if <name> never
# changes — so no version in any artifact name. What version someone has is on
# the release, in the installer, and under Help in the app itself.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Stories live in the profile, not in the install folder. Uninstalling must
  # not take them, and the docs say so — this is the line that makes it true.
  deleteAppDataOnUninstall: false
  artifactName: Lamplit-Setup.${ext}

portable:
  # A USB-stick copy keeps its data beside itself, the way the zip does.
  unpackDirName: Lamplit
  artifactName: Lamplit-portable.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  synopsis: Write a story with a language model, in chapters.
  # A .deb has to name a maintainer, and this project's only contact is its
  # issues. GitHub's noreply address is the nearest thing to saying so in a
  # field that will not take "open an issue" for an answer.
  maintainer: Lamplit <lamplit-app@users.noreply.github.com>
  artifactName: Lamplit.${ext}
# macOS is deliberately not built: an unsigned build is refused by Gatekeeper,
# and notarising it needs an Apple Developer licence this project does not hold.
# See PLAN.md §5.5. A contributor who has one needs this block and a
# macos-latest job in .github/workflows/release.yml, and nothing else.
#
# mac:
#   target:
#     - target: dmg
#       arch: [x64, arm64]
#   category: public.app-category.productivity
#   artifactName: Lamplit-${arch}.${ext}
