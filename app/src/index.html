<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lamplit</title>
    <base href="/" />
    <!-- `viewport-fit=cover` lets the page reach into the notch and the home
         bar, which is only safe because the stylesheet pays `env(safe-area-inset-*)`
         back on the bar, the sheets and the foot of the story.
         `interactive-widget=resizes-content` makes the on-screen keyboard shrink
         the viewport rather than slide over it, which is what makes `dvh`
         mean "the part you can actually see" while you are typing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Both, and neither preferred: the theme follows this machine unless the
         reader has chosen a side, and `styles.scss` says the same thing in the
         property itself. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Which side, if they have chosen one, on the first frame rather than a
         fetch later. The file says why it is a file and not three lines here. -->
    <script src="boot-theme.js"></script>
    <!-- The .ico first, the SVG after it: browsers take the last one they
         understand, so anything modern gets the scalable mark. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Added to the home screen, Lamplit opens as itself: its own icon, no
         browser chrome, the page colour behind it. There is no service worker
         and there will not be one — the app is a window onto a server on your
         desk, and it has nothing to say offline. -->
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Angular replaces everything inside <app-root> when it bootstraps, and
         until it does this is the whole page. In the desktop window it carries
         on from the shell's splash without a word changing; in a browser tab it
         is the only thing between the navigation and the app. -->
    <app-root>
      <div class="booting">
        <p class="booting-mark">Lamplit</p>
        <p class="booting-line">Lighting the lamp…</p>
      </div>
    </app-root>
  </body>
</html>
